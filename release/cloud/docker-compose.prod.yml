services:
  vlm-tunnel:
    image: alpine:3.20
    container_name: jigu-vlm-tunnel
    environment:
      VLM_SSH_HOST: ${VLM_SSH_HOST}
      VLM_SSH_PORT: ${VLM_SSH_PORT}
      VLM_SSH_USER: ${VLM_SSH_USER}
      VLM_SSH_PASSWORD: ${VLM_SSH_PASSWORD}
      VLM_REMOTE_API_PORT: ${VLM_REMOTE_API_PORT}
      VLM_LOCAL_TUNNEL_PORT: ${VLM_LOCAL_TUNNEL_PORT}
    command:
      - sh
      - -c
      - >-
        apk add --no-cache openssh-client sshpass &&
        while true; do
          echo '[vlm-tunnel] establishing ssh tunnel...';
          sshpass -p "$$VLM_SSH_PASSWORD" ssh -o StrictHostKeyChecking=no -o PreferredAuthentications=password -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -o ExitOnForwardFailure=yes -N -L 0.0.0.0:$$VLM_LOCAL_TUNNEL_PORT:127.0.0.1:$$VLM_REMOTE_API_PORT -p $$VLM_SSH_PORT $$VLM_SSH_USER@$$VLM_SSH_HOST;
          echo '[vlm-tunnel] tunnel dropped, retry in 2s';
          sleep 2;
        done
    restart: unless-stopped
    networks:
      - jigu-net

  mysql:
    image: mysql:8.0
    container_name: jigu-mysql
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - jigu_mysql_data:/var/lib/mysql
      - ./01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks:
      - jigu-net
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: jigu-redis
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - jigu_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks:
      - jigu-net
    restart: unless-stopped

  jigu-python:
    image: ${JIGU_PYTHON_IMAGE}
    container_name: jigu-python
    environment:
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      INTERNAL_IP_WHITELIST: ${INTERNAL_IP_WHITELIST:-}
      ENV: ${PYTHON_ENV:-production}
      LOG_LEVEL: ${PYTHON_LOG_LEVEL:-INFO}
      UVICORN_WORKERS: ${UVICORN_WORKERS:-2}
      VLM_BASE_URL: ${VLM_BASE_URL}
      VLM_API_KEY: ${VLM_API_KEY}
      VLM_MODEL_NAME: ${VLM_MODEL_NAME}
      VLM_TIMEOUT: ${VLM_TIMEOUT:-60.0}
      VLM_ENABLE_THINKING: ${VLM_ENABLE_THINKING:-}
      QIANFAN_API_KEY: ${QIANFAN_API_KEY:-}
      QIANFAN_SECRET_KEY: ${QIANFAN_SECRET_KEY:-}
      QIANFAN_BASE_URL: ${QIANFAN_BASE_URL:-}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-600.0}
      VECTOR_BACKEND: ${VECTOR_BACKEND:-chroma}
      VECTOR_DB_URL: ${VECTOR_DB_URL:-}
      CHROMA_PERSIST_DIR: /app/chroma_data
      CHROMA_COLLECTION: ${CHROMA_COLLECTION:-jigu_artifacts}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-paraphrase-multilingual-MiniLM-L12-v2}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-384}
      REDIS_URL: redis://redis:6379/0
      BOS_ENDPOINT: ${BOS_ENDPOINT:-}
      BOS_ACCESS_KEY: ${BOS_ACCESS_KEY:-}
      BOS_SECRET_KEY: ${BOS_SECRET_KEY:-}
      BOS_BUCKET: ${BOS_BUCKET:-}
      JAVA_BASE_URL: http://jigu-java:8080
    depends_on:
      redis:
        condition: service_healthy
      vlm-tunnel:
        condition: service_started
    volumes:
      - jigu_chroma_data:/app/chroma_data
      - jigu_sentence_cache:/app/.cache/sentence_transformers
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks:
      - jigu-net
    restart: unless-stopped

  jigu-java:
    image: ${JIGU_JAVA_IMAGE}
    container_name: jigu-java
    environment:
      JAVA_TOOL_OPTIONS: -Dsun.net.inetaddr.ttl=60 -Dsun.net.inetaddr.negative.ttl=0
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_SECONDS: ${JWT_EXPIRES_SECONDS:-3600}
      PYTHON_BASE_URL: http://jigu-python:8000
      PYTHON_CONNECT_TIMEOUT_MS: ${PYTHON_CONNECT_TIMEOUT_MS:-5000}
      PYTHON_READ_TIMEOUT_MS: ${PYTHON_READ_TIMEOUT_MS:-600000}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      BOS_ENDPOINT: ${BOS_ENDPOINT:-}
      BOS_ACCESS_KEY: ${BOS_ACCESS_KEY:-}
      BOS_SECRET_KEY: ${BOS_SECRET_KEY:-}
      BOS_BUCKET: ${BOS_BUCKET:-}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      jigu-python:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/api/v1/health | grep '\"code\":200' >/dev/null || exit 1"]
      interval: 10s
      timeout: 15s
      retries: 30
      start_period: 30s
    networks:
      - jigu-net
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: jigu-nginx
    ports:
      - "${NGINX_HTTP_PORT}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      jigu-java:
        condition: service_healthy
    networks:
      - jigu-net
    restart: unless-stopped

volumes:
  jigu_mysql_data:
  jigu_redis_data:
  jigu_chroma_data:
  jigu_sentence_cache:

networks:
  jigu-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
