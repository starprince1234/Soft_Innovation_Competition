# ============================================================
# 稽古云语 - 本地开发配置（mvn spring-boot:run 默认激活）
# ============================================================

server:
  port: 8080

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/jigu?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: root
    password: root
  data:
    redis:
      host: localhost
      port: 6379
  jpa:
    show-sql: true

jigu:
  jwt:
    # 本地开发请使用足够长的随机字符串（至少 32 字符），生产环境通过环境变量注入
    secret: dev_jwt_secret_at_least_32_chars!
    expires-seconds: 7200
  python:
    base-url: ${PYTHON_BASE_URL:http://localhost:8000}
    internal-token: ${INTERNAL_TOKEN:dev_internal_token}
    connect-timeout: ${PYTHON_CONNECT_TIMEOUT_MS:5000}
    read-timeout: ${PYTHON_READ_TIMEOUT_MS:600000}
  bos:
    endpoint: ${BOS_ENDPOINT:}
    access-key: ${BOS_ACCESS_KEY:}
    secret-key: ${BOS_SECRET_KEY:}
    bucket: ${BOS_BUCKET:}
    health-check-bucket-exists: ${BOS_HEALTH_CHECK_BUCKET_EXISTS:false}
  redis:
    jwt-blacklist-prefix: "jwt_blacklist:"
  app:
    allowed-image-types: image/png,image/jpeg,image/webp
    max-screenshot-size: 2097152
    max-detect-image-size: 10485760

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
