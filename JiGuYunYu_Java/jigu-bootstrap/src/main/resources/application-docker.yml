server:
  port: 8080

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:mysql}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:jigu}?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:jigu}
    password: ${MYSQL_PASSWORD:jigu_pass}
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}

jigu:
  jwt:
    secret: ${JWT_SECRET:change_me_in_production_32chars!}
    expires-seconds: ${JWT_EXPIRES_SECONDS:3600}
  python:
    base-url: ${PYTHON_BASE_URL:http://jigu-python:8000}
    internal-token: ${INTERNAL_TOKEN:change_me_internal_token}
  bos:
    endpoint: ${BOS_ENDPOINT:}
    access-key: ${BOS_ACCESS_KEY:}
    secret-key: ${BOS_SECRET_KEY:}
    bucket: ${BOS_BUCKET:}
  redis:
    jwt-blacklist-prefix: "jwt_blacklist:"
  app:
    allowed-image-types: image/png,image/jpeg,image/webp
    max-screenshot-size: 2097152
    max-detect-image-size: 10485760

logging:
  level:
    com.jigu.cloud: INFO
