services:
  mysql:
    image: mysql:8.0
    container_name: jigu-mysql
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - ./data/mysql:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks:
      - jigu-net
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: jigu-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks:
      - jigu-net
    restart: unless-stopped

  jigu-python:
    image: ${DH_USER:-jigu}/jigu-python:${VER:-latest}
    container_name: jigu-python
    environment:
      # ---- 内部鉴权 ----
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      INTERNAL_IP_WHITELIST: ${INTERNAL_IP_WHITELIST:-}
      # ---- 运行环境 ----
      ENV: ${PYTHON_ENV:-production}
      LOG_LEVEL: ${PYTHON_LOG_LEVEL:-INFO}
      UVICORN_WORKERS: ${UVICORN_WORKERS:-2}
      # ---- VLM 检测模型（Qwen3-VL-LoRA）----
      VLM_BASE_URL: ${VLM_BASE_URL:-}
      VLM_API_KEY: ${VLM_API_KEY:-}
      VLM_MODEL_NAME: ${VLM_MODEL_NAME:-qwen3-vl-lora}
      VLM_TIMEOUT: ${VLM_TIMEOUT:-60.0}
      # ---- 千帆 LLM ----
      QIANFAN_API_KEY: ${QIANFAN_API_KEY:-}
      QIANFAN_SECRET_KEY: ${QIANFAN_SECRET_KEY:-}
      QIANFAN_BASE_URL: ${QIANFAN_BASE_URL:-}
      # ---- 向量库 (ChromaDB) ----
      VECTOR_BACKEND: ${VECTOR_BACKEND:-chroma}
      VECTOR_DB_URL: ${VECTOR_DB_URL:-}
      CHROMA_PERSIST_DIR: /app/chroma_data
      CHROMA_COLLECTION: ${CHROMA_COLLECTION:-jigu_artifacts}
      # ---- Embedding (Sentence-BERT) ----
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-paraphrase-multilingual-MiniLM-L12-v2}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-384}
      # ---- Redis 缓存 ----
      REDIS_URL: redis://redis:6379/0
      # ---- BOS 对象存储 ----
      BOS_ENDPOINT: ${BOS_ENDPOINT:-}
      BOS_ACCESS_KEY: ${BOS_ACCESS_KEY:-}
      BOS_SECRET_KEY: ${BOS_SECRET_KEY:-}
      BOS_BUCKET: ${BOS_BUCKET:-}
      # ---- Java 后端（知识库重建时 Python 调 Java）----
      JAVA_BASE_URL: http://jigu-java:8080
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./data/chroma:/app/chroma_data
      - ./data/sentence_transformers_cache:/app/.cache/sentence_transformers
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks:
      - jigu-net
    restart: unless-stopped

  jigu-java:
    image: ${DH_USER:-jigu}/jigu-java:${VER:-latest}
    container_name: jigu-java
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      # ---- MySQL ----
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      # ---- Redis ----
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # ---- JWT ----
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_SECONDS: ${JWT_EXPIRES_SECONDS:-3600}
      # ---- Python 内部调用 ----
      PYTHON_BASE_URL: http://jigu-python:8000
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      # ---- BOS 对象存储 ----
      BOS_ENDPOINT: ${BOS_ENDPOINT:-}
      BOS_ACCESS_KEY: ${BOS_ACCESS_KEY:-}
      BOS_SECRET_KEY: ${BOS_SECRET_KEY:-}
      BOS_BUCKET: ${BOS_BUCKET:-}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      jigu-python:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/api/v1/health | grep '\"code\":200' >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - jigu-net
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: jigu-nginx
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      # - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # - ./nginx/ssl:/etc/nginx/ssl:ro  # 生产环境启用 HTTPS 时取消注释
    depends_on:
      jigu-java:
        condition: service_healthy
    networks:
      - jigu-net
    restart: unless-stopped

networks:
  jigu-net:
    driver: bridge
